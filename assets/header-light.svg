<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Manpreet Singh. Software engineer building backends, data pipelines and the apps on top." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif; text-anchor: middle; }
    .name { font-size: 78px; font-weight: 700; letter-spacing: -2.5px; fill: #1d1d1f; }
    .sub  { font-size: 38px; font-weight: 600; letter-spacing: -0.8px; fill: #86868b; }
    .note { font-size: 24px; font-weight: 500; fill: #86868b; }
    .dot  { fill: #30d158; }
    .halo { fill: #30d158; transform-box: fill-box; transform-origin: center; animation: halo 2.4s ease-out infinite; }
    .in { opacity: 0; animation: in 1s cubic-bezier(0.22, 0.61, 0.36, 1) forwards; }
    .d1 { animation-delay: 0.1s; }
    .d2 { animation-delay: 0.35s; }
    .d3 { animation-delay: 0.6s; }
    .d4 { animation-delay: 0.9s; }
    @keyframes in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes halo { 0% { transform: scale(1); opacity: 0.5; } 100% { transform: scale(3); opacity: 0; } }
  </style>

  <text class="name in d1" x="450" y="112">Manpreet Singh</text>
  <text class="sub in d2" x="450" y="178">Software engineer building backends,</text>
  <text class="sub in d3" x="450" y="224">data pipelines and the apps on top.</text>

  <g class="in d4">
    <circle class="halo" cx="278" cy="280" r="5"/>
    <circle class="dot" cx="278" cy="280" r="5"/>
    <text class="note" x="460" y="288">Open to roles starting 2027</text>
  </g>
</svg>
